<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon — Groling Group</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .truck-wrapper {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translate(-100%, -50%);
            animation: driveAcross 3s linear forwards;
            z-index: 10;
        }

        .truck-image {
            width: 350px;
            min-width: 350px;
            height: auto;
            display: block;
        }

        @keyframes driveAcross {
            0% {
                transform: translate(-100%, -50%);
            }

            100% {
                transform: translate(100vw, -50%);
            }
        }

        .content-wrapper {
            opacity: 0;
            transform: translateY(20px);
            animation: revealText 1s ease-out 2.2s forwards;
            position: relative;
            z-index: 5;
        }

        @keyframes revealText {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #1f2937;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: clamp(3.5rem, 6vw, 5rem);
            margin: 0 0 8px 0;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            line-height: 1;
        }

        h1 span {
            color: #d35400;
        }

        p {
            color: #64748b;
            margin: 0;
            font-size: 1.15rem;
        }
    </style>
</head>

<body>

    <div class="truck-wrapper">
        <img src="assets/small_truck.png" alt="Groling Transport Truck" class="truck-image" />
    </div>

    <div class="content-wrapper">
        <h1>Website <span>Coming Soon</span></h1>
        <p>We are currently building this page. Check back later.</p>
    </div>

</body>

</html>
